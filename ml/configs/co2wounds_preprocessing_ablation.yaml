# Ablação de pré-processamento — CO2Wounds-V2 (binário, from-zero)

dataset: co2wounds_v2
task: binary
approach: from_zero
data_mode: processed

variants:
  - name: y_only
    label: "Canal Y"
    bilateral: false
    otsu: false
  - name: y_bilateral
    label: "Canal Y + Bilateral"
    bilateral: true
    otsu: false
  - name: y_otsu
    label: "Canal Y + Otsu"
    bilateral: false
    otsu: true
  - name: y_bilateral_otsu
    label: "Canal Y + Bilateral + Otsu"
    bilateral: true
    otsu: true

output_name_pattern: "modelo_binario_co2wounds_ablation_{variant}"
processed_root: "data/co2wounds_v2/processed/ablation/{variant}/train_images_binary"

# Estes valores são repassados por scripts/run_co2wounds_training_ablation.sh
# (variáveis de ambiente EPOCHS e BATCH_SIZE). Mantenha os dois lados em sincronia.
epochs: 40
# Batch < 8 quebra as BatchNorm do ResNet50 e o treino colapsa na classe majoritária.
batch_size: 16
learning_rate: 0.0001
dropout: 0.5
class_weight: balanced      # leprosy 1.5 / outros 0.75 na base 485/970
monitor: val_auc            # acusa aprendizado real com classes desbalanceadas
require_gpu: true
