[project]
name = "leprosy-classification-models-tcc"
version = "0.1.0"
description = "Modelos de deep learning para classificação de imagens dermatológicas (TCC)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # GTX 1650 = sm_75. TF 2.16+ wheels oficiais removem sm_75 → CUDA_ERROR_LAUNCH_FAILED
    "tensorflow[and-cuda]==2.15.1",
    "numpy>=1.21",
    "opencv-python>=4.5",
    "pillow>=8.3",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "seaborn>=0.11",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leprosy_ml"]

[tool.uv]
package = true
